capability_catalog:
  # Tier: basic | standard | advanced | expert
  #   basic:    simple extraction, formatting, short Q&A (1-7B params)
  #   standard: analysis, summarization, structured research (8-14B params)
  #   advanced: complex planning, structured JSON, DAG design (14B+ / fast cloud)
  #   expert:   multi-step reasoning, code gen, workflow decomposition (top cloud)

  # --- Decision / System One Models (Jev-compatible, non-autoregressive) ---
  "jev:latest":
    tier: basic
    decision_only: true
    max_context: 16384
    strengths: [system_one_decision, binary_noul, routing_choice, rubric_score, speed]
    weaknesses: [text_generation, complex_reasoning, code_generation, dag_planning]

  "typesafe/jev-1.14":
    tier: basic
    decision_only: true
    max_context: 32768
    strengths: [system_one_decision, binary_noul, routing_choice, rubric_score, speed]
    weaknesses: [text_generation, complex_reasoning, code_generation, dag_planning]

